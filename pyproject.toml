[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "coldplatetwin"
version = "0.1.0"
description = "Offline experiment analysis and reduced-order models for the Rev A cold plate"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
coldplate = "coldplatetwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


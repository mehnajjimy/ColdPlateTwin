name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dependencies: [minimum, current]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: matrix.dependencies == 'minimum'
        run: python -m pip install numpy==1.26.4 scipy==1.12.0 pandas==2.2.0 matplotlib==3.8.0 pytest==8.0.0
      - if: matrix.dependencies == 'minimum'
        run: python -m pip install -e '.[test]'
      - if: matrix.dependencies == 'current'
        run: python -m pip install -e '.[test,dashboard]'
      - run: pytest
      - run: coldplate demo --output /tmp/coldplate-demo
